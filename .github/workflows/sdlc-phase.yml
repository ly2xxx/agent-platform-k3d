name: SDLC Phase Check

# Checks one built phase (a pull request from phase/<feature>/<n> into
# feature/<feature>) against the approved plan before it is merged. The check
# lives in ly2xxx/.github; see sdlc/README.md.

on:
  pull_request:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  phase:
    uses: ly2xxx/.github/.github/workflows/sdlc-phase.yml@main
    with:
      # Same install and suite as sdlc.yml.
      install-command: if [ -f uv.lock ]; then uv sync --locked; elif [ -f pyproject.toml ]; then uv sync; fi; if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi; uv pip install pyyaml
      test-command: python -m pytest -q
