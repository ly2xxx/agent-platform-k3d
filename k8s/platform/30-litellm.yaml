apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-platform
  labels:
    app: litellm
    app.kubernetes.io/part-of: besa-ai-platform
data:
  config.yaml: |
    model_list:
      - model_name: "deepseek-v4-flash:cloud"
        litellm_params:
          model: "ollama/deepseek-v4-flash:cloud"
          api_base: "http://host.docker.internal:11434"
      - model_name: "qwen3.5:cloud"
        litellm_params:
          model: "ollama/qwen3.5:cloud"
          api_base: "http://host.docker.internal:11434"
      - model_name: "default-model"
        litellm_params:
          model: "ollama/deepseek-v4-flash:cloud"
          api_base: "http://host.docker.internal:11434"
    litellm_settings:
      drop_params: true
      telemetry: false
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app: litellm
    app.kubernetes.io/part-of: besa-ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/part-of: besa-ai-platform
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
              name: http
          # Credentials come from Secrets made by scripts/new-dev-secrets.ps1.
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL   # $(POSTGRES_PASSWORD) is expanded by Kubernetes from the line above
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres.ai-platform.svc.cluster.local:5432/litellm"
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secret, key: LITELLM_MASTER_KEY } }
            - name: UI_USERNAME
              value: "admin"
            - name: UI_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-secret, key: UI_PASSWORD } }
            # Empty until you create a Langfuse project and re-run the script with its keys.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: litellm-secret, key: LANGFUSE_PUBLIC_KEY } }
            - name: LANGFUSE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: litellm-secret, key: LANGFUSE_SECRET_KEY } }
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.ai-platform.svc.cluster.local:3000"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app: litellm
    app.kubernetes.io/part-of: besa-ai-platform
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
