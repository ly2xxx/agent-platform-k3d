{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "besa.fullname" . }}-test"
  namespace: {{ include "besa.appsNs" . }}
  labels:
    {{- include "besa.labels" (dict "ctx" . "component" "test" "partOf" "besa-agent-platform") | nindent 4 }}
    # Selected by allow-agents-to-platform so the test pod may reach the platform tier.
    tier: agent-runtime
  annotations:
    "helm.sh/hook": test
    # before-hook-creation only: the pod survives the run so `helm test --logs`
    # can read it, and is replaced on the next run.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  {{- include "besa.affinity" . | nindent 2 }}
  containers:
    - name: probes
      image: {{ .Values.tests.image }}
      env:
        - name: TARGETS
          value: |
            {{- if .Values.apps.webui.enabled }}
            webui|http://webui.{{ include "besa.appsNs" . }}.svc.cluster.local:{{ .Values.apps.webui.port }}/healthz
            {{- end }}
            {{- if .Values.apps.agents.enabled }}
            agent-1|{{ include "besa.agent1Url" . }}/healthz
            agent-2|{{ include "besa.agent2Url" . }}/healthz
            {{- end }}
            {{- if .Values.apps.gateway.enabled }}
            agent-gateway|{{ include "besa.gatewayUrl" . }}/healthz
            {{- end }}
            {{- if .Values.apps.mcp.enabled }}
            mcp-server|{{ include "besa.mcpUrl" . }}/healthz
            {{- end }}
            {{- if .Values.apps.sandbox.enabled }}
            headless-browser|{{ include "besa.browserWs" . | replace "ws://" "http://" }}/json/version
            {{- end }}
            {{- if .Values.platform.litellm.enabled }}
            litellm|{{ include "besa.litellmUrl" . }}/health/readiness
            {{- end }}
            {{- if .Values.platform.langfuse.enabled }}
            langfuse-web|{{ include "besa.langfuseUrl" . }}/api/public/health
            {{- end }}
      command:
        - python
        - -c
        - |
          import os, sys, urllib.request
          failures = []
          for line in os.environ["TARGETS"].strip().splitlines():
              line = line.strip()
              if not line:
                  continue
              name, url = line.split("|", 1)
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      status = r.status
              except Exception as e:
                  print(f"FAIL {name:18} {url} -> {e}")
                  failures.append(name)
                  continue
              if status == 200:
                  print(f"OK   {name:18} {url} -> 200")
              else:
                  print(f"FAIL {name:18} {url} -> {status}")
                  failures.append(name)
          if failures:
              print(f"\n{len(failures)} probe(s) failed: {', '.join(failures)}")
              sys.exit(1)
          print("\nAll probes passed.")
      resources:
        {{- toYaml .Values.initResources | nindent 8 }}
{{- end }}
